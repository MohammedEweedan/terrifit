name: Build and deploy to DigitalOcean

# Builds the container, pushes it to DigitalOcean Container Registry, and lets
# App Platform pull the new tag. Migrations are NOT run here — they run as an
# App Platform pre-deploy job, so they execute once against the live database
# rather than once per CI run from a runner that should not be able to reach it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Once App Platform starts a deployment, cancelling its GitHub runner does
  # not stop that remote migration. Keep the rollout (including --wait) alive
  # and queue the next commit so pre-deploy jobs cannot race from this workflow.
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: registry.digitalocean.com
  # The DOCR namespace, i.e. the registry name you created in DigitalOcean.
  REGISTRY_NAME: terrifit
  IMAGE_NAME: terrifit-web

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest

    # A throwaway Postgres, because some of these tests are integration tests
    # and have to be. `rate-limit.test.ts` guards a bug that no mock can see:
    # Prisma maps DateTime to `timestamp` while SQL `NOW()` is `timestamptz`,
    # so every window read as already expired and the limiter let everything
    # through while still returning true and still writing rows. Only a real
    # query shows that. This is disposable and never touches production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terrifit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/terrifit_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # `next-env.d.ts` and `.next/types` are generated, and gitignored by
      # Next's own default. Without them `tsc` on a fresh clone cannot resolve
      # `*.png` imports (the `next/image-types/global` reference lives in
      # next-env.d.ts) or the `PageProps`/`LayoutProps` globals Next 16 emits
      # for route files — ten errors that never appear locally, because a dev
      # server has always regenerated them. `typegen` does this without paying
      # for a full build.
      - run: npx next typegen

      - run: npx tsc --noEmit
      - run: npm run lint

      # The schema has to exist before the integration tests touch it.
      - run: npx prisma migrate deploy

      - run: npm test
      - run: npm run test:deploy
      # Every locale must carry every key; a missing one silently ships English.
      - run: npm run check:i18n

  build:
    name: Build image and push to DOCR
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Checked before the action runs, because `action-doctl` fails with
      # "Input required and not supplied: token" — which reads like a bug in
      # the workflow rather than a secret nobody has added yet.
      - name: Check the DigitalOcean token is configured
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "$DO_TOKEN" ]; then
            echo "::error::DIGITALOCEAN_ACCESS_TOKEN is not set on this repository."
            echo "Add it under Settings > Secrets and variables > Actions > New repository secret."
            echo "Generate the token at https://cloud.digitalocean.com/account/api/tokens"
            echo "It needs write access to Container Registry and Apps."
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Pinned, not inferred. App Platform runs linux/amd64. A build on an
          # Apple Silicon machine defaults to arm64, pushes without complaint,
          # and then fails to start on App Platform with an exec-format error
          # that looks nothing like an architecture problem. GitHub's runners
          # are amd64 natively, so this costs nothing here and would cost a
          # QEMU emulation pass anywhere else.
          platforms: linux/amd64
          # Both tags: the SHA is what App Platform pins to, `latest` is for
          # pulling by hand when something needs reproducing locally.
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache in the registry, so a dependency-only change does not
          # rebuild the whole tree on every push.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Roll out
        # App Platform pulls the new image. The pre-deploy job in .do/app.yaml
        # runs `prisma migrate deploy` before any new container takes traffic.
        #
        # Skipped when the app does not exist yet. `doctl apps create` fails
        # with "Image tag or digest not found" until something has been pushed
        # to the registry, so the very first run has to be push-only — and
        # that should not look like a broken pipeline.
        env:
          APP_ID: ${{ secrets.DIGITALOCEAN_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "DIGITALOCEAN_APP_ID is not set — image pushed, deploy skipped."
            echo "The image now exists, so create the app once with:"
            echo "  doctl apps create --spec .do/app.yaml"
            echo "then add its ID as the DIGITALOCEAN_APP_ID secret."
            exit 0
          fi
          # `update --spec`, not `create-deployment`.
          #
          # create-deployment redeploys whatever spec the app already has, so
          # every change to .do/app.yaml stayed in the repo and never reached
          # DigitalOcean — the migrate job kept running an `npx` command that
          # had been fixed locally three times over. Applying the spec makes
          # the file the source of truth and still triggers the deployment.
          # The service and its pre-deploy job must use the same immutable
          # image, even when another push updates the registry's latest tag.
          node scripts/prepare-deploy.mjs "$GITHUB_SHA" "$RUNNER_TEMP/terrifit-app.yaml"
          doctl apps update "$APP_ID" --spec "$RUNNER_TEMP/terrifit-app.yaml" --wait

      # Mirrors public/media to R2 after a successful rollout. Skipped entirely
      # when the secrets are absent, so a fork or a repo without the bucket
      # configured still deploys. The files stay in the image either way — R2
      # is the fast path, not the only one.
      - name: Sync media to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # Guarded in the shell rather than with `if:`, because a step's own
          # env block is not in scope when its condition is evaluated.
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 secrets not configured — skipping media sync."
            exit 0
          fi
          npm ci --no-audit --no-fund
          npm run sync:r2
