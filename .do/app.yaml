# DigitalOcean App Platform spec.
#
# Apply with:
#   doctl apps update <APP_ID> --spec .do/app.yaml
# or create with:
#   doctl apps create --spec .do/app.yaml
#
# The database is a managed cluster, NOT a container. App Platform containers
# have no persistent volumes and are rescheduled on every deploy, scale event
# and failed health check — a Postgres container would lose its data.

name: terrifit
region: nyc

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080

    image:
      registry_type: DOCR
      repository: terrifit-web
      # Set by `doctl apps create-deployment` from CI; pinned to a commit SHA
      # so a rollback is a redeploy of a known tag rather than a rebuild.
      tag: latest

    health_check:
      http_path: /en
      initial_delay_seconds: 20
      period_seconds: 15
      failure_threshold: 3

    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://terri.fit
      # App Platform binds this from the attached cluster. It already carries
      # `?sslmode=require`, so anything appended must use `&`, not `?`.
      #
      # Fine at one or two instances. Prisma opens a pool per instance and a
      # 1GB managed cluster allows roughly 22 connections, so before scaling
      # past that: create a connection pool on the cluster in the DigitalOcean
      # console (transaction mode), then replace this value with that pool's
      # own connection string — it has a different port and database name —
      # and append `&pgbouncer=true&connection_limit=1`. `pgbouncer=true` only
      # tells Prisma to stop using prepared statements; on its own it routes
      # nothing.
      # `uselibpqcompat=true` is not optional here. Without it the pg driver
      # treats `sslmode=require` as `verify-full`, and DigitalOcean's managed
      # cluster presents a certificate signed by its own CA, which is not in
      # Node's trust store. The result is
      #   "Error opening a TLS connection: self-signed certificate in chain"
      # on every query — a failure that reads like a broken app rather than a
      # connection-string flag.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}&uselibpqcompat=true

jobs:
  # Runs to completion before any new container takes traffic. Migrations
  # belong here, not in the image build: the build runs on every CI push and
  # must not touch the live database, and this runs once per deploy.
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: apps-s-1vcpu-0.5gb
    image:
      registry_type: DOCR
      repository: terrifit-web
      tag: latest
    # The CLI's real entrypoint, not `npx` and not the `.bin` shim.
    #
    # `npx` fetches from the registry when the package is missing, which had
    # this job doing a network install at container start. The `.bin/prisma`
    # symlink is no better: Docker COPY flattens it into a real file whose
    # relative `require("./cli.js")` then points at the wrong directory.
    # Running build/index.js in place resolves both.
    # Wrapped in `sh -c` because App Platform execs run_command directly
    # rather than through a shell: `cd migrate && node …` had it looking for
    # an executable named "cd" and failing with exit 128 before the container
    # even started.
    run_command: sh -c "cd migrate && node node_modules/prisma/build/index.js migrate deploy"
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        # Migrations take DDL locks and must not go through the transaction
        # pooler, which cannot hold a session across statements. The TLS flag is
        # needed here for the same reason as above, or the job fails before it
        # applies anything.
        #
        # This is not a style preference. `prisma migrate` guards itself with
        # `pg_advisory_lock(72707369)`, which is session-scoped: run through
        # PgBouncer in transaction mode and the lock is taken on one backend
        # while the unlock is delivered to another. The lock is then orphaned on
        # an idle pooler connection and every later run dies with
        #   P1002 ... Timed out trying to acquire a postgres advisory lock
        # until that backend is terminated or the pool is restarted. Always use
        # this direct binding, never a pool connection string.
        value: ${db.DATABASE_URL}&uselibpqcompat=true

databases:
  - name: db
    engine: PG
    version: "17"
    production: true
    cluster_name: terrifit-db
