# DigitalOcean App Platform spec.
#
# Apply with:
#   doctl apps update <APP_ID> --spec .do/app.yaml
# or create with:
#   doctl apps create --spec .do/app.yaml
#
# The database is a managed cluster, NOT a container. App Platform containers
# have no persistent volumes and are rescheduled on every deploy, scale event
# and failed health check — a Postgres container would lose its data.

name: terrifit
region: nyc

services:
  - name: web
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080

    image:
      registry_type: DOCR
      repository: terrifit-web
      # Set by `doctl apps create-deployment` from CI; pinned to a commit SHA
      # so a rollback is a redeploy of a known tag rather than a rebuild.
      tag: latest

    health_check:
      http_path: /en
      initial_delay_seconds: 20
      period_seconds: 15
      failure_threshold: 3

    envs:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://terrifit.com
      # Prisma opens a pool per instance. A 1GB managed cluster allows about
      # 22 connections, so three instances on default pooling exhaust it.
      # ${db.DATABASE_URL} is bound by App Platform; the pgbouncer flags route
      # through DigitalOcean's connection pool in transaction mode.
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}?pgbouncer=true&connection_limit=1

jobs:
  # Runs to completion before any new container takes traffic. Migrations
  # belong here, not in the image build: the build runs on every CI push and
  # must not touch the live database, and this runs once per deploy.
  - name: migrate
    kind: PRE_DEPLOY
    instance_size_slug: apps-s-1vcpu-0.5gb
    image:
      registry_type: DOCR
      repository: terrifit-web
      tag: latest
    run_command: npx prisma migrate deploy
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        # Migrations take DDL locks and must not go through the transaction
        # pooler, which cannot hold a session across statements.
        value: ${db.DATABASE_URL}

databases:
  - name: db
    engine: PG
    version: "17"
    production: true
    cluster_name: terrifit-db
